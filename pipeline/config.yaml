# =============================================================================
# Daily AI Insight Engine - Pipeline Configuration
# =============================================================================
# 驱动 4 阶段流水线：ingest → extract → analyze → synthesize
# 数据源按 "黄金三角" 体系组织：学术/技术 · 产品/社区 · 商业/资本

# =============================================================================
# 全局流水线设置
# =============================================================================
pipeline:
  name: "Daily AI Insight Engine"
  version: "1.0.0"

  data_dirs:
    raw: "data/01_raw"
    processed: "data/02_processed"
    extracted: "data/02_extracted"
    structured: "data/03_structured"
    reports: "data/05_reports"

# =============================================================================
# 黄金三角分类元数据 (前端展示用, 流水线忽略)
# =============================================================================
tiers_meta:
  A:
    label: "技术与前沿"
    subtitle: "学术论文 & 官方技术博客 — 代表技术最前沿与基础研究信号"
    rationale: "最高信噪比的第一手技术信息。arXiv 提供未经修饰的学术前沿，顶级 AI 实验室（OpenAI、Anthropic、Google、NVIDIA、Hugging Face）的官方博客提供第一手产品发布和研究突破。这类源的共同特点是技术深度高、商业化包装少，是 AI 情报的「原材料」。"
  B:
    label: "产品与开发者"
    subtitle: "社区讨论 & 开发者情绪 — 反映产品落地热度与开发者真实反馈"
    rationale: "开发者社区的实时情绪温度计。Hacker News 和 GitHub Trending 反映一线开发者关注什么、在建造什么；Product Hunt 展示新产品的市场接受度；Ben's Bites 提供资深 AI 观察者的策展视角；知乎覆盖中文技术社区的讨论热点。开发者情绪通常领先资本动向 3–6 个月，是预判产业方向的先行指标。"
  C:
    label: "商业与资本"
    subtitle: "科技媒体 & 行业报道 — 捕捉商业落地、资本动向与产业趋势"
    rationale: "商业化进程的完整记录。西方科技媒体（TechCrunch、The Verge）追踪融资、收购和产品发布；TLDR AI 和 KDnuggets 提供行业聚合与技术教程；中文 AI 媒体（机器之心、量子位、36氪）覆盖中国 AI 产业动态。这类源回答「技术有什么用、谁在买单」的问题，构成情报三角的商业底座。"

# =============================================================================
# 数据源配置
# =============================================================================
# sourceType 枚举 (对齐 pipeline/schemas/base_info.py:SourceType):
#   academic_paper       - 学术论文 (arXiv 等)
#   tech_blog            - 技术博客/官方发布
#   news_media           - 科技媒体
#   community_discussion - 社区讨论/社交媒体
# =============================================================================

sources:

  # ===========================================================================
  # 顶点 A: 技术与前沿 (Academic & Technical)
  # ===========================================================================

  - name: "arxiv-cs-ai"
    type: academic_paper
    tier: A
    enabled: true
    display_name: "arXiv CS.AI"
    description: "arXiv 计算机科学 · AI 分类"
    display_description: "arXiv 人工智能分类下的最新预印本，通过 RSS 实时获取。覆盖 LLM、Agent、多模态、对齐、推理等前沿研究方向，关键词过滤确保信噪比，仅保留高质量技术论文摘要。"
    url: "https://rss.arxiv.org/rss/cs.AI"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "LLM"
        - "Agent"
        - "VLA"
        - "RLHF"
        - "RAG"
        - "Transformer"
        - "diffusion"
        - "multimodal"
        - "alignment"
        - "reasoning"
        - "fine-tuning"
        - "benchmark"
      max_age_hours: 48
    truncation:
      mode: abstract_only
    target_dir: "arxiv"

  - name: "openai-blog"
    type: tech_blog
    tier: A
    enabled: true
    display_name: "OpenAI Blog"
    description: "OpenAI 官方博客"
    display_description: "OpenAI 官方博客，发布 GPT 系列模型、ChatGPT、API、安全对齐等领域的第一手技术公告和研究进展。作为全球最有影响力的 AI 公司之一，其官方信息源技术可信度最高。"
    url: "https://openai.com/blog/rss.xml"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "GPT"
        - "ChatGPT"
        - "agent"
        - "model"
        - "API"
        - "safety"
        - "alignment"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "deepmind-blog"
    type: tech_blog
    tier: A
