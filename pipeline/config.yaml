# =============================================================================
# LLM 配置 (按流水线阶段)
# =============================================================================
llm:
  provider: "anthropic"
  models:
    extract:
      name: "claude-sonnet-4-6"
      temperature: 0.1
      max_tokens: 4096
    analyze:
      name: "claude-opus-4-7"
      temperature: 0.3
      max_tokens: 8192
    synthesize:
      name: "claude-opus-4-7"
      temperature: 0.4
      max_tokens: 16384

  retry:
    max_retries: 3
    backoff: exponential
    initial_delay_seconds: 2

  rate_limit:
    requests_per_minute: 50
    concurrent_requests: 5

# =============================================================================
# 各阶段参数
# =============================================================================
stages:

  ingest:
    time_window_hours: 48
    max_articles_per_source: 5
    hard_filters:
      dedup_by_url: true
      dedup_by_title_similarity: 0.85
      skip_non_english_without_translation: false
    output:
      format: markdown
      frontmatter_fields:
        - title
        - source
        - author
        - published
        - created
        - description
        - tags

  extract:
    schema: "pipeline/schemas/fact_extraction.py::FactExtraction"
    input_dir: "data/01_raw"
    output:
      processed_dir: "data/02_processed"
      structured_file: "data/03_structured/daily-insights-{date}.json"
    batch_size: 5
    skip_existing: true

  analyze:
    input_dir: "data/02_processed"
    output_dir: "data/02_processed"
    personas:
      - name: "tech-architect"
        description: "技术架构师视角"
        schema: "pipeline/schemas/deep_analysis.py::QualitativeAssessment"
      - name: "capital-analyst"
        description: "资本分析师视角"
        schema: "pipeline/schemas/deep_analysis.py::ValueAssessment"
      - name: "risk-assessor"
        description: "风控专家视角"
        schema: "pipeline/schemas/deep_analysis.py::ForesightAndActionability"
    concurrency: 3
    skip_existing: true

  synthesize:
    input:
      dir: "data/03_analyzed"
      frontmatter_only: true
    output:
      report_file: "data/05_reports/daily-report.json"
      markdown_report: "data/05_reports/daily-report.md"
    top_n: 5
    max_input_articles: 30
    sections:
      - "executive_summary"
      - "top_events"
      - "trend_insights"
      - "risk_signals"
      - "opportunity_signals"

# =============================================================================
# 配额分配
# =============================================================================
quotas:
  per_tier:
