# =============================================================================
# Daily AI Insight Engine - Pipeline Configuration
# =============================================================================
# 驱动 4 阶段流水线：ingest → extract → analyze → synthesize
# 数据源按 "黄金三角" 体系组织：学术/技术 · 产品/社区 · 商业/资本

# =============================================================================
# 全局流水线设置
# =============================================================================
pipeline:
  name: "Daily AI Insight Engine"
  version: "1.0.0"

  data_dirs:
    manifest: "data/00_manifest"
    raw: "data/01_raw"
    processed: "data/02_processed"
    extracted: "data/02_extracted"
    structured: "data/03_structured"
    analyzed: "data/03_analyzed"
    synthesize_structured: "data/04_structured"
    reports: "data/05_reports"

  # 去重状态文件路径（相对项目根目录）
  state_file: "data/state.json"

# =============================================================================
# 数据源配置
# =============================================================================
# sourceType 枚举 (对齐 pipeline/schemas/base_info.py:SourceType):
#   academic_paper       - 学术论文 (arXiv 等)
#   tech_blog            - 技术博客/官方发布
#   news_media           - 科技媒体
#   community_discussion - 社区讨论/社交媒体
# =============================================================================

sources:

  # ===========================================================================
  # 顶点 A: 技术与前沿 (Academic & Technical)
  # ===========================================================================

  - name: "arxiv-cs-ai"
    type: academic_paper
    tier: A
    enabled: true
    priority: 1
    display_name: "arXiv CS.AI"
    description: "arXiv 计算机科学 · AI 分类"
    display_description: "arXiv 人工智能分类下的最新预印本，通过 RSS 实时获取。覆盖 LLM、Agent、多模态、对齐、推理等前沿研究方向，关键词过滤确保信噪比，仅保留高质量技术论文摘要。"
    url: "https://rss.arxiv.org/rss/cs.AI"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "LLM"
        - "Agent"
        - "VLA"
        - "RLHF"
        - "RAG"
        - "Transformer"
        - "diffusion"
        - "multimodal"
        - "alignment"
        - "reasoning"
        - "fine-tuning"
        - "benchmark"
      max_age_hours: 48
    limit: 15  # arxiv cs.AI 日均 400+ 篇, 关键词命中率近 100%, 必须限流
    truncation:
      mode: abstract_only

  - name: "anthropic-blog"
    type: tech_blog
    tier: A
    enabled: true
    priority: 2
    display_name: "Anthropic Blog"
    description: "Anthropic 官方新闻 (sitemap 解析)"
    display_description: "Anthropic 官方新闻与技术发布，聚焦 Claude 模型能力演进、AI 安全与对齐研究、企业级应用实践。通过 sitemap 解析获取完整更新，是追踪 AI 安全方向的重要窗口。"
    url: "https://www.anthropic.com/sitemap.xml"
    language: en
    fetch_strategy: scrape
    filter:
      keywords: []  # Anthropic 官方博客内容均与 AI 强相关，不做关键词过滤
      max_age_hours: 168  # Anthropic 发布频率低, 从 72h 放宽到 7 天
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "openai-blog"
    type: tech_blog
    tier: A
    enabled: true
    priority: 3
    display_name: "OpenAI Blog"
    description: "OpenAI 官方博客"
    display_description: "OpenAI 官方博客，发布 GPT 系列模型、ChatGPT、API、安全对齐等领域的第一手技术公告和研究进展。作为全球最有影响力的 AI 公司之一，其官方信息源技术可信度最高。"
    url: "https://openai.com/blog/rss.xml"
    language: en
    fetch_strategy: browser
    timeout: 60
    wait_until: domcontentloaded
    wait_for_fn: "document.body.innerText.length > 200"
    filter:
      keywords:
        - "GPT"
        - "ChatGPT"
        - "agent"
        - "model"
        - "API"
        - "safety"
        - "alignment"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

