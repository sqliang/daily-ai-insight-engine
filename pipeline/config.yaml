      limit: 3000

# =============================================================================
# LLM 配置 (按流水线阶段)
# =============================================================================
llm:
  provider: "anthropic"
  models:
    extract:
      name: "deepseek-v4-flash"
      temperature: 0.1
      max_tokens: 4096
    analyze:
      name: "deepseek-v4-flash"
      temperature: 0.3
      max_tokens: 8192
    synthesize:
      name: "deepseek-v4-pro"
      temperature: 0.4
      max_tokens: 16384

  retry:
    max_retries: 3
    backoff: exponential
    initial_delay_seconds: 2

  rate_limit:
    requests_per_minute: 50
    concurrent_requests: 5

# =============================================================================
# 各阶段参数
# =============================================================================
stages:

  ingest:
    concurrency: 5           # 线程池并发抓取线程数

    max_articles_per_source: 5
    hard_filters:
      dedup_by_url: true
      dedup_by_title_similarity: 0.85
      skip_non_english_without_translation: false
    output:
      format: markdown
      frontmatter_fields:
        - title
        - source
        - author
        - published
        - created
        - description
        - tags

  extract:
    schema: "pipeline/schemas/fact_extraction.py::FactExtraction"
    input_dir: "data/01_raw"
    output:
      processed_dir: "data/02_processed"
      structured_file: "data/03_structured/daily-insights-{date}.json"
    batch_size: 5
    skip_existing: true

  analyze:
    input_dir: "data/02_processed"
    output_dir: "data/02_processed"
    personas:
      - name: "tech-architect"
        description: "技术架构师视角"
        schema: "pipeline/schemas/deep_analysis.py::QualitativeAssessment"
      - name: "capital-analyst"
        description: "资本分析师视角"
        schema: "pipeline/schemas/deep_analysis.py::ValueAssessment"
      - name: "risk-assessor"
        description: "风控专家视角"
        schema: "pipeline/schemas/deep_analysis.py::ForesightAndActionability"
      # TODO: 专题分析能力暂时停用，待重新设计后恢复。
      # - name: "github-project-analyst"
      #   description: "GitHub 开源项目深度分析"
      #   schema: "pipeline/schemas/specialized_analysis.py::GitHubProjectAnalysis"
      #   source_match: ["github-trending"]
      # - name: "paper-analyst"
      #   description: "论文深度分析"
      #   schema: "pipeline/schemas/specialized_analysis.py::PaperAnalysis"
      #   source_match: ["arxiv-cs-ai"]
      # - name: "product-analyst"
      #   description: "产品深度分析"
      #   schema: "pipeline/schemas/specialized_analysis.py::ProductAnalysis"
      #   source_match: ["producthunt", "whytryai"]
    concurrency: 3
    skip_existing: true

  # ---------------------------------------------------------------------------
  # Stage 4a: Frontmatter 聚合 — 将 analyzed .md 文件提取为结构化 JSON
  # ---------------------------------------------------------------------------
  # lookback_days: 按 frontmatter.created 字段过滤文章的时效窗口（天）
  #   1 = 仅当天（默认），0 = 不限（包含所有历史文章）
  #   设计理由：created 在 Stage 1b ingest 时写入 date.today()，
  #   精确表示"pipeline 哪天抓取的文章"，不受外部 RSS 解析质量影响
  # archive_reports: Stage 4b 合成时是否生成带日期后缀的归档报告
  aggregate:
    lookback_days: 1          # all_articles.json 日报窗口 (天)，0 = 不限
    hot_days: 7               # per-source JSON 热数据窗口 (天)
    max_history_days: 365     # archive 分片最大保留天数，0 = 不限
    archive_reports: true     # 是否生成 daily-report-{date}.json 归档副本

  # ---------------------------------------------------------------------------
  # Stage 4b: Editor-in-Chief 日报合成 — 读取 all_articles.json 生成日报
  # ---------------------------------------------------------------------------
  # 若 CLI 指定 --lookback-days N，会先调用 aggregate 重新过滤再合成
  synthesize:
    input:
      dir: "data/04_structured"
      frontmatter_only: true
    output:
      report_file: "data/05_reports/daily-report.json"
      markdown_report: "data/05_reports/daily-report.md"
    top_n: 5
    max_input_articles: 30
    sections:
      - "executive_summary"
      - "top_events"
      - "trend_insights"
      - "risk_signals"
      - "opportunity_signals"
      # TODO: 专题分析能力暂时停用，待重新设计后恢复。
      # - "specialized_brief"

# =============================================================================
# 配额分配
# =============================================================================
quotas:
  per_tier:
    A: 5
    B: 5
    C: 5
  total_target: 15
  overflow: drop_by_impact
