# =============================================================================
# Daily AI Insight Engine - Pipeline Configuration
# =============================================================================
# 驱动 4 阶段流水线：ingest → extract → analyze → synthesize
# 数据源按 "黄金三角" 体系组织：学术/技术 · 产品/社区 · 商业/资本

# =============================================================================
# 全局流水线设置
# =============================================================================
pipeline:
  name: "Daily AI Insight Engine"
  version: "1.0.0"

  data_dirs:
    raw: "data/01_raw"
    processed: "data/02_processed"
    extracted: "data/02_extracted"
    structured: "data/03_structured"
    reports: "data/04_reports"

# =============================================================================
# 数据源配置
# =============================================================================
# sourceType 枚举 (对齐 pipeline/schemas/base_info.py:SourceType):
#   academic_paper       - 学术论文 (arXiv 等)
#   tech_blog            - 技术博客/官方发布
#   news_media           - 科技媒体
#   community_discussion - 社区讨论/社交媒体
# =============================================================================

sources:

  # ===========================================================================
  # 顶点 A: 技术与前沿 (Academic & Technical)
  # ===========================================================================

  - name: "arxiv-cs-ai"
    type: academic_paper
    tier: A
    enabled: true
    description: "arXiv 计算机科学 · AI 分类"
    url: "https://rss.arxiv.org/rss/cs.AI"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "LLM"
        - "Agent"
        - "VLA"
        - "RLHF"
        - "RAG"
        - "Transformer"
        - "diffusion"
        - "multimodal"
        - "alignment"
        - "reasoning"
        - "fine-tuning"
        - "benchmark"
      max_age_hours: 48
    truncation:
      mode: abstract_only
    target_dir: "arxiv"

  - name: "openai-blog"
    type: tech_blog
    tier: A
    enabled: true
    description: "OpenAI 官方博客"
    url: "https://openai.com/blog/rss.xml"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "GPT"
        - "ChatGPT"
        - "agent"
        - "model"
        - "API"
        - "safety"
        - "alignment"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "deepmind-blog"
    type: tech_blog
    tier: A
    enabled: true
    description: "Google AI Blog (含 DeepMind)"
    url: "https://blog.google/technology/ai/rss/"
    language: en
    fetch_strategy: rss
    filter:
      keywords: []  # Google AI blog 内容广泛, 不过滤关键词
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "anthropic-blog"
    type: tech_blog
    tier: A
    enabled: true
    description: "Anthropic 官方新闻 (sitemap 解析)"
    url: "https://www.anthropic.com/sitemap.xml"
    language: en
    fetch_strategy: scrape
    filter:
      keywords:
        - "Claude"
        - "safety"
        - "alignment"
        - "constitutional"
        - "agent"
        - "enterprise"
        - "API"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "nvidia-blog"
    type: tech_blog
    tier: A
    enabled: true
    description: "NVIDIA AI 技术博客"
    url: "https://blogs.nvidia.com/feed/"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "GPU"
        - "inference"
        - "training"
        - "CUDA"
        - "H100"
        - "B100"
        - "TensorRT"
        - "model"
        - "AI"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "meta-ai-blog"
    type: tech_blog
    tier: A
    enabled: false
    description: "Meta AI 官方博客 (无 RSS, 待实现 HTML 抓取)"
    url: "https://ai.meta.com/blog/"
    language: en
    fetch_strategy: scrape
    filter:
      keywords:
        - "Llama"
        - "open source"
        - "model"
        - "tooling"
        - "fine-tuning"
        - "multimodal"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "microsoft-ai-blog"
    type: tech_blog
    tier: A
    enabled: false
    description: "Microsoft AI 官方博客 (RSS 已停更, 最新文章 2022 年)"
    filter:
      keywords:
        - "AI"
        - "Copilot"
        - "Azure"
        - "model"
        - "agent"
        - "data"
        - "open source"
      max_age_hours: 72
    truncation:
      mode: first_n_chars
      limit: 3000

  - name: "huggingface-blog"
    type: tech_blog
    tier: A
    enabled: true
    description: "Hugging Face 官方博客"
    url: "https://huggingface.co/blog/feed.xml"
    language: en
    fetch_strategy: rss
    filter:
      keywords:
        - "model"
        - "LLM"
        - "dataset"
