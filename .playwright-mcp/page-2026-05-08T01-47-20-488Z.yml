      - generic [ref=e3730]:
        - heading "Appendix A Limitations and Complementarity of Heuristics" [level=2] [ref=e3731]:
          - generic [ref=e3732]: Appendix A
          - text: Limitations and Complementarity of Heuristics
        - paragraph [ref=e3734]:
          - text: "Unpaired modality translation is non-identifiable in general: many joint distributions are consistent with the same endpoint marginals while inducing different conditional relationships between source and target variables. The heuristics considered in this work restrict the space of admissible couplings by imposing complementary structural constraints on the learned diffusion bridge. A qualitative summary is provided in Table"
          - link "4" [ref=e3735] [cursor=pointer]:
            - /url: "#A1.T4"
          - text: .
        - paragraph [ref=e3737]: Endpoint marginal matching constrains the distribution of the target variable but leaves the conditional distribution given the source unconstrained. As a result, it does not restrict the dependence between source and target and admits solutions that ignore the conditioning endpoint. Cycle consistency introduces a reversibility constraint on the induced stochastic mapping, limiting many-to-one couplings that discard information about the source. However, enforcing consistency only at the endpoints does not constrain how probability mass is transported between them and can admit stochastic processes that satisfy endpoint reversibility while exhibiting incoherent or highly diffusive dynamics at intermediate times. Enforcing cycle consistency at intermediate diffusion times addresses this limitation by constraining the forward and reverse processes throughout the trajectory, thereby discouraging solutions that rely on endpoint-only cancellations and promoting coherent probability transport. Such endpoint-only solutions do not define stable conditional distributions, as their consistency depends on fragile cancellations rather than structured transport across time.
        - paragraph [ref=e3739]:
          - text: Paired supervision directly specifies a joint distribution and therefore resolves coupling ambiguity by construction, but requires access to paired data. Viewed jointly, marginal constraints restrict admissible endpoint distributions, reversibility-based constraints limit information loss from source to target, and paired supervision selects a specific coupling when available. Their complementary roles explain why combining multiple heuristics is necessary to obtain diffusion bridges that are both distributionally valid and conditionally informative, as summarized in Table
          - link "4" [ref=e3740] [cursor=pointer]:
            - /url: "#A1.T4"
          - text: .
        - 'figure "Table 4: Qualitative comparison of heuristics and the failure modes they address. Marginal matching enforces validity under the target marginal but does not identify a coupling. Cycle constraints reduce coupling degeneracy by enforcing reversibility, with trajectory-level constraints additionally regularizing intermediate diffusion states. Paired supervision provides direct correspondence and can be composed with unpaired heuristics when available." [ref=e3741]':
