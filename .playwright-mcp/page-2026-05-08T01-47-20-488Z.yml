            - heading "Effect of structured constraints on coupling." [level=4] [ref=e2940]
            - paragraph [ref=e2942]:
              - text: Table
              - link "1" [ref=e2943] [cursor=pointer]:
                - /url: "#S4.T1"
              - text: presents the effects of incrementally adding structural constraints across different supervision levels. Figure
              - link "3" [ref=e2944] [cursor=pointer]:
                - /url: "#S4.F3"
              - text: depicts how these effects evolve as a function of the supervision parameter
              - math [ref=e2945]:
                - generic [ref=e2947]: ρ
              - text: . In the fully unpaired scenario (
              - math [ref=e2948]:
                - generic [ref=e2950]:
                  - generic [ref=e2951]: ρ
                  - generic [ref=e2952]: =
                  - generic [ref=e2953]: "0"
              - text: ), marginal matching alone provides reasonable alignment of endpoint distributions. This is indicated by low SWD and MMD
              - superscript [ref=e2954]: "2"
              - text: values. However, this approach does not recover meaningful couplings, resulting in poor content accuracy and elevated endpoint cycle error. Introducing endpoint-level cycle consistency substantially reduces cycle MSE and significantly improves content accuracy. This suggests that endpoint reversibility partially addresses coupling ambiguity. Enforcing cycle consistency throughout the entire diffusion trajectory further enhances semantic alignment. This underscores the need to constrain intermediate stochastic flows rather than rely solely on endpoint agreement.
            - paragraph [ref=e2956]:
              - text: The combination of all constraints produces the strongest performance in the unpaired regime, achieving an optimal balance between coupling quality and reversibility while maintaining competitive marginal alignment. This pattern is consistently observed across all
              - math [ref=e2957]:
                - generic [ref=e2959]: ρ
              - text: values in Figure
              - link "3" [ref=e2960] [cursor=pointer]:
                - /url: "#S4.F3"
              - text: . Compared to paired-only baselines, semi-paired training shows monotonic improvements in coupling quality and reversibility, while marginal alignment metrics remain stable. Overall, these trends indicate that the observed improvements result from enhanced structural alignment between endpoints rather than overfitting to the target distribution.
            - paragraph [ref=e2962]:
              - text: This trend continues in the semi-paired setting (
              - math [ref=e2963]:
                - generic [ref=e2965]:
                  - generic [ref=e2966]: ρ
                  - generic [ref=e2967]: =
                  - generic [ref=e2968]: "0.5"
              - text: ) and extends to the fully paired regime (
              - math [ref=e2969]:
                - generic [ref=e2971]:
                  - generic [ref=e2972]: ρ
                  - generic [ref=e2973]: =
                  - generic [ref=e2974]: "1.0"
              - text: ). Semi-paired training with structured constraints consistently outperforms paired-only baselines at all supervision levels, including
              - math [ref=e2975]:
                - generic [ref=e2977]:
                  - generic [ref=e2978]: ρ
                  - generic [ref=e2979]: =
                  - generic [ref=e2980]: "1.0"
              - text: . This demonstrates the complementary nature of partial pairing and heuristic regularization. Additional results for alternative synthetic data generation configurations are provided in Appendix
