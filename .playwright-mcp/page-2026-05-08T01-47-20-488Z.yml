          - text: ), and trajectory-level cycle consistency regularizes the stochastic flow. These constraints are independent of paired supervision, enabling the direct incorporation of inductive bias into the transport plan. This formulation advances learning by combining principled geometric enforcement with example-based methods.
        - paragraph [ref=e115]:
          - text: Empirical results demonstrate that explicit structural constraints enhance both performance and robustness. In the fully paired setting, SDB surpasses state-of-the-art performance, increasing PSNR on super-resolution (FFHQ
