        - generic [ref=e151]:
          - heading "Diffusion bridges for modality translation." [level=4] [ref=e152]
          - paragraph [ref=e154]:
            - text: Diffusion bridges have become a strong paradigm for
            - emphasis [ref=e155]: distribution-to-distribution
            - text: translation with diffusion models, including practical instantiations for translation tasks and latent variants such as LDDBM
            - generic [ref=e156]:
              - text: (De Bortoli et al.,
              - link "2021" [ref=e157] [cursor=pointer]:
                - /url: "#bib.bib62"
              - text: ; Shi et al.,
              - link "2023" [ref=e158] [cursor=pointer]:
                - /url: "#bib.bib65"
              - text: ; Liu et al.,
              - link "2023" [ref=e159] [cursor=pointer]:
                - /url: "#bib.bib64"
              - text: ; Zhou et al.,
              - link "2024" [ref=e160] [cursor=pointer]:
                - /url: "#bib.bib66"
              - text: ; Berman et al.,
              - link "2025" [ref=e161] [cursor=pointer]:
                - /url: "#bib.bib9"
              - text: )
            - text: . In most translation-oriented bridge methods,
            - emphasis [ref=e162]: paired
            - text: correspondences are the primary source of identifiability and the main way to enforce semantic alignment, so performance is tightly coupled to dense pairing. By contrast, classical unpaired translation methods rely on surrogate alignment signals such as cycle consistency or contrastive objectives
            - generic [ref=e163]:
              - text: (Zhu et al.,
              - link "2017" [ref=e164] [cursor=pointer]:
                - /url: "#bib.bib51"
              - text: ; Liu et al.,
              - link "2017" [ref=e165] [cursor=pointer]:
                - /url: "#bib.bib103"
              - text: ; Park et al.,
              - link "2020" [ref=e166] [cursor=pointer]:
                - /url: "#bib.bib102"
              - text: )
            - text: . We find LADB
            - generic [ref=e167]:
              - text: (Wang et al.,
              - link "2025" [ref=e168] [cursor=pointer]:
                - /url: "#bib.bib113"
              - text: )
            - text: as a closely related approach. It reduces pairing demands by reusing a pretrained source latent diffusion model to map source samples to latent endpoints and training a target latent diffusion model with a mixture of paired and unpaired latent–target couplings. Rather than aiming to replace unpaired pipelines or relying on dense pairing, we strengthen bridge-based translation
            - emphasis [ref=e169]: even at full supervision
            - text: via explicit structural constraints, and show they remain informative as pairing becomes scarce, yielding graceful degradation.
        - generic [ref=e170]:
          - heading "Schrödinger bridges, optimal transport, and unpaired couplings." [level=4] [ref=e171]
          - paragraph [ref=e173]:
            - text: Schrödinger bridges (SB) connect stochastic transport to entropy-regularized optimal transport and provide a principled view of learning couplings between endpoint marginals
            - generic [ref=e174]:
              - text: (De Bortoli et al.,
              - link "2021" [ref=e175] [cursor=pointer]:
                - /url: "#bib.bib62"
              - text: ; Shi et al.,
              - link "2023" [ref=e176] [cursor=pointer]:
                - /url: "#bib.bib65"
              - text: ; Tong et al.,
              - link "2024" [ref=e177] [cursor=pointer]:
                - /url: "#bib.bib107"
              - text: )
            - text: . This perspective naturally accommodates
            - emphasis [ref=e178]: unpaired
            - text: "data, but in modality translation the coupling can remain underdetermined without additional inductive structure. Recent unpaired SB instantiations illustrate complementary trade-offs: UNSB"
            - generic [ref=e179]:
              - text: (Kim et al.,
              - link "2024" [ref=e180] [cursor=pointer]:
                - /url: "#bib.bib106"
              - text: )
            - text: casts learning as a sequential adversarial procedure, which can be susceptible to GAN-style failure modes (e.g., instability, mode collapse, and hyperparameter sensitivity), particularly in complex modality translation, while simulation-free approximations depend on a chosen ground cost or feature space that may not match semantic correspondence
            - generic [ref=e181]:
              - text: (Tong et al.,
              - link "2024" [ref=e182] [cursor=pointer]:
                - /url: "#bib.bib107"
              - text: )
            - text: . We therefore focus on constraints that improve bridge-based translation under full pairing and remain informative as pairing diminishes.
