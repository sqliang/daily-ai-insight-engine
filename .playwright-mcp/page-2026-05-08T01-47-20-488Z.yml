                - text: (Berman et al.,
                - link "2025" [ref=e3430] [cursor=pointer]:
                  - /url: "#bib.bib9"
                - text: )
              - text: show a pronounced drop in performance as
              - math [ref=e3431]:
                - generic [ref=e3433]: ρ
              - text: decreases, suggesting that purely data-driven diffusion models struggle to maintain consistent multiview-to-shape couplings in the absence of explicit regularization or structural constraints. Notably, while baselines are not applicable when
              - math [ref=e3434]:
                - generic [ref=e3436]:
                  - generic [ref=e3437]: ρ
                  - generic [ref=e3438]: =
                  - generic [ref=e3439]: "0"
              - text: ", SDB remains applicable."
      - generic [ref=e3440]:
        - heading "6 Discussion" [level=2] [ref=e3441]:
          - generic [ref=e3442]: "6"
          - text: Discussion
        - paragraph [ref=e3444]: We introduced SDB as a constrained latent diffusion bridging framework that models modality translation as a heuristically constrained stochastic process. It induces structure into the bridge learning process, which translates into additional inductive bias that restrict the solution space of valid bridges. In contrast to methods that require paired data, this approach employs pairing as a data-driven heuristic within a broader diffusion-bridge framework. As a by-product, by integrating this heuristic with structural constraints, the framework supports a range of supervision regimes. Experimental results indicate improved performance in fully paired settings, stable outcomes in semi-paired scenarios, and robust unpaired translation. Although modality translation remains under-constrained without full supervision, the findings suggest that latent diffusion bridges offer a principled solution.
        - generic [ref=e3445]:
          - heading "Limitations." [level=4] [ref=e3446]
          - paragraph [ref=e3448]:
            - text: Individual heuristics do not completely solve the ambiguity in modality translation. MM (Section
            - link "4.1" [ref=e3449] [cursor=pointer]:
              - /url: "#S4.SS1"
            - text: ) matches the target marginal but may ignore the conditioning endpoint. Moreover, the WTA increases complexity as
            - math [ref=e3450]:
              - generic [ref=e3452]: K
            - text: grows. CC (Section
            - link "4.2" [ref=e3453] [cursor=pointer]:
              - /url: "#S4.SS2"
            - text: ) preserves content but does not ensure marginal matching. Using these methods together can help find bridge solutions with stronger couplings. Appendix
            - link "A" [ref=e3454] [cursor=pointer]:
              - /url: "#A1"
            - text: discusses these failure modes and their effects, and future work may introduce more constraints and inductive biases within the diffusion bridge framework.
      - generic [ref=e3455]:
        - heading "Impact Statement" [level=2] [ref=e3456]
        - paragraph [ref=e3458]: We introduced a method that tackles previously addressed tasks that are solved through Modality Translation. With this, we intend to drive the progress of machine learning, specifically in the context of Modality Translation through the application of methods that are commonly used recently, such as Denoising Diffusion Bridge Models and Latent Diffusion Models. Therefore, we neither expect nor intend to create a potential societal consequence that should be mentioned.
