            - text: )
          - text: . Notably, Latent Denoising Diffusion Bridge Models (LDDBM)
          - generic [ref=e92]:
            - text: (Berman et al.,
            - link "2025" [ref=e93] [cursor=pointer]:
              - /url: "#bib.bib9"
            - text: )
          - text: have achieved state-of-the-art results by leveraging a shared latent space to address dimensional mismatches. Despite these advances, many bridge approaches predominantly depend on paired correspondences to define and learn effective translations.
        - paragraph [ref=e95]:
          - text: The exclusive reliance on paired supervision presents a significant limitation. In conventional denoising diffusion bridge models
          - generic [ref=e96]:
            - text: (Zhou et al.,
            - link "2024" [ref=e97] [cursor=pointer]:
              - /url: "#bib.bib66"
            - text: )
          - text: ", training with paired data implicitly enforces three requirements: semantic correspondence (mapping the source to the target), distributional validity (ensuring that outputs match the target marginal), and geometric consistency (maintaining invertibility). Relying solely on paired loss to learn transport geometry from the ground up may not fully exploit the problem’s inherent structure. This strategy can be suboptimal even with abundant data, as the model may minimize reconstruction error while failing to adhere to the underlying manifold. Distinguishing these constraints enables paired supervision to focus on correspondences, while dedicated objectives enforce distributional and geometric properties."
        - paragraph [ref=e99]:
          - text: To address this, we introduce Structured Diffusion Bridge (SDB) as a framework that augments LDDBM
