        - generic [ref=e131]:
          - generic [ref=e132]:
            - generic [ref=e133]:
              - paragraph [ref=e134]:
                - text: On Wednesday, xAI and Anthropic announced
                - link "a surprise partnership" [ref=e135] [cursor=pointer]:
                  - /url: https://www.anthropic.com/news/higher-limits-spacex
                - text: that has the Claude-maker buying out “all of the compute capacity at [xAI’s] Colossus 1 data center,” roughly 300MW that allowed Anthropic to immediately raise its usage limits. It’s a huge deal for xAI, likely worth billions of dollars. More importantly, it immediately monetized
                - link "one of the company’s most impressive accomplishments" [ref=e136] [cursor=pointer]:
                  - /url: https://newsletter.semianalysis.com/p/xais-colossus-2-first-gigawatt-datacenter
                - text: ", turning xAI from a consumer to a provider of compute."
              - paragraph [ref=e137]:
                - text: It’s tempting to see the arrangement as a shot at OpenAI amid the ongoing lawsuit. But Musk’s explanation on X was that xAI had already
                - link "moved training to a newer data center, Colossus 2" [ref=e138] [cursor=pointer]:
                  - /url: https://x.com/elonmusk/status/2052069691372478511
                - text: ", and xAI simply didn’t need them both."
              - generic: Advertisement
              - paragraph [ref=e139]:
                - text: In the short term, there’s an obvious logic at work. xAI’s existing products are mostly focused on Grok, which has seen
                - link "plummeting usage" [ref=e140] [cursor=pointer]:
                  - /url: https://www.forbes.com/sites/conormurray/2026/05/05/elon-musks-grok-loses-users-throughout-2026-as-rivals-rise/
                - text: since the image generation debacles earlier this year. If xAI’s data center buildout is much more than what Grok needs to operate, partnering with Anthropic adds a lot of green to the balance sheet. This is especially useful as the company, now combined with SpaceX, speeds toward an IPO. More broadly, having Anthropic lined up as a customer makes it easier to believe that SpaceX’s orbital data center play
                - link "might actually work" [ref=e141] [cursor=pointer]:
                  - /url: https://techcrunch.com/2026/02/11/why-the-economics-of-orbital-ai-are-so-brutal/
                - text: .
              - paragraph [ref=e142]: But beyond the short-term benefit, the Anthropic partnership sends an unusual message about where Elon Musk’s priorities really lie. It suggests the company’s real business may be more about building data centers than training AI models.
              - paragraph [ref=e143]: It’s rare to see a major tech company treat compute resources this way when companies like Google and Meta, which are also training models, are building more data centers. It’s an easy point to miss, because so many of these companies are working as enterprise AI vendors, online services, and cloud providers all at once. But when forced to make a choice between selling more available compute to customers and preserving some to build their own tools, they reliably choose door No. 2.
              - paragraph [ref=e144]: Just last month, Sundar Pichai admitted on a call that Google Cloud revenue was lower than it could have been because the company was “capacity constrained” — and when given the choice of renting out their GPUs or using them to develop AI products, Google chose the AI products.
              - paragraph [ref=e145]: Facebook has faced a more extreme version of the same constraint, spinning up an entirely new cloud apparatus just to ensure they would have enough GPU power to chase Mark Zuckerberg’s AI ambition. As he put it when announcing Meta Compute in January, “How we engineer, invest, and partner to build this infrastructure will become a strategic advantage.”
              - generic [ref=e147]:
                - img [ref=e149]
                - generic [ref=e151]:
                  - generic [ref=e153]:
                    - 'heading "This Week Only: Buy one pass, get the second at 50% off" [level=3] [ref=e154]'
                    - heading "Your next round. Your next hire. Your next breakout opportunity. Find it at TechCrunch Disrupt 2026, where 10,000+ founders, investors, and tech leaders gather for three days of 250+ tactical sessions, powerful introductions, and market-defining innovation. Register before May 8 to bring a +1 at half the cost." [level=4] [ref=e155]: Your next round. Your next hire. Your next breakout opportunity. Find it at TechCrunch Disrupt 2026, where 10,000+ founders, investors, and tech leaders gather for three days of 250+ tactical sessions, powerful introductions, and market-defining innovation. Register before May 8 to bring a +1 at half the cost.
                  - generic [ref=e156]: San Francisco, CA | October 13-15, 2026
                  - link "REGISTER NOW" [ref=e160] [cursor=pointer]:
                    - /url: https://techcrunch.com/events/techcrunch-disrupt/?utm_source=tc&utm_medium=ad&utm_campaign=disrupt2026&utm_content=bogo&promo=rightrail_ebbogo&display=
              - paragraph [ref=e161]: The key word there is “strategic.” Both Zuckerberg and Pichai are looking toward a future where AI is powering the most popular and lucrative systems in the world. Computing power isn’t just a way to satisfy today’s inference demand, but to build tomorrow’s products — and running short on compute means missing out on that chance.
              - paragraph [ref=e162]:
                - text: "By focusing on data centers (earthbound and otherwise), xAI is positioning itself more like a neocloud business: buying GPUs from Nvidia and renting them out to model developers like Anthropic. It’s a far more difficult business, squeezed by both chip suppliers and the shifting cycles of demand. The valuations for most active neoclouds reflect that reality: xAI was"
                - link "valued at $230 billion" [ref=e163] [cursor=pointer]:
                  - /url: https://www.cnbc.com/2026/01/06/elon-musk-xai-raises-20-billion-from-nvidia-cisco-investors.html
                - text: in its January funding round; CoreWeave, which oversees a comparable quantity of computing power, is worth
                - link "less than a third of that" [ref=e164] [cursor=pointer]:
                  - /url: https://robinhood.com/us/en/stocks/CRWV/
                - text: .
              - paragraph [ref=e165]:
                - text: Musk’s version of a neocloud is more ambitious, as you might expect. Some of the data centers might be in space — at least by 2035, if things go according to plan. xAI will be making its own chips
                - link "at the Terafab" [ref=e166] [cursor=pointer]:
                  - /url: https://terafab.ai/
                - text: ", which will take away some but not all of Nvidia’s pricing power. But none of it changes the basic economics of the neocloud business."
              - generic: Advertisement
              - paragraph [ref=e167]:
                - text: As recently as
                - link "the February all-hands" [ref=e168] [cursor=pointer]:
                  - /url: https://techcrunch.com/2026/02/11/xai-lays-out-interplanetary-ambitions-in-public-all-hands/
                - text: ", xAI had real ambitions in software. That was the presentation that unveiled the orbital data center project, but it also teased significant ambitions in coding (since bolstered by"
                - link "the Cursor partnership" [ref=e169] [cursor=pointer]:
                  - /url: https://techcrunch.com/2026/04/21/spacex-is-working-with-cursor-and-has-an-option-to-buy-the-startup-for-60-billion/
                - text: ) and interesting ideas like leveraging computer use into full-scale digital twins (in the unfortunately named Macrohard project). These are the kind of long-horizon projects that need committed computing resources to succeed. As long as xAI is selling large quantities of compute to its competitors, it’s hard to think such new ambitions have much of a future.
