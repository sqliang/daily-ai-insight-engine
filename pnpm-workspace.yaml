# ---------------------------------------------------------------------------
# 单包工作区与依赖构建权限
# ---------------------------------------------------------------------------

# 显式声明仓库根目录为唯一 package，兼容 pnpm 9 的 workspace 校验。
packages:
  - "."

# pnpm 11 默认阻止依赖构建脚本；sharp 需要安装脚本选择本机二进制，
# esbuild 为 drizzle-kit 的运行时依赖（加载 TS 配置/迁移文件）。
allowBuilds:
  esbuild: true
  sharp: true
