name: 功能建议
description: 提出新功能或改进建议
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 为什么要做这个功能？解决了什么痛点？
      placeholder: 例如：目前每日报告缺少 ...
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 期望功能
      description: 清晰描述希望实现的功能
      placeholder: 例如：在仪表盘增加 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 可能的实现方案
      description: 如果你已有思路，可以简述

  - type: checkboxes
    id: pr
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我愿意提交 PR 实现这个功能
