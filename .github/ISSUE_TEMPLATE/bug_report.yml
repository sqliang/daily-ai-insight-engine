name: Bug 报告
description: 报告一个可复现的问题
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug！请尽量填写完整信息，便于我们快速定位和修复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
      placeholder: 例如：运行 `pnpm build` 时报错 ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 列出从干净环境复现问题的步骤
      placeholder: |
        1. 克隆仓库
        2. 执行 ...
        3. 看到错误 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 vs 实际行为
      placeholder: |
        期望：...
        实际：...

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python/Node 版本、分支等
      placeholder: |
        OS: macOS 14
        Node: 20.x
        Python: 3.11
        分支: main

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 如有错误日志、截图，请贴在这里
